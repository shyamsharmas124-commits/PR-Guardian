name: PR Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Keep this workflow limited to PRs from branches in this same repository for the MVP.
# Fork PRs are skipped because pull_request workflows do not receive secrets/write access there.
jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # Needed only if optional auto-merge is enabled.
      pull-requests: write  # Create PR review + inline comments.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Review pull request
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ENABLE_AUTO_MERGE: ${{ vars.ENABLE_AUTO_MERGE }}
        run: python scripts/review_pr.py
